
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ordered list</title>
</head>
<body>
    <!--ordered list-->
    <ol type="a">
        <li>bread</li>
        <li>tea</li>
        <li>butter</li>

    </ol>

<!--unordered list-->
    <ul>
        <li>butter</li>
        <li>bread</li>
        <li>jam</li>
    </ul>

    <ol>
        <li><b>happy</b></li>

    </ol>
    
</body>
</html>
